name: 🔄 Hus Auto Renew

on:
  schedule:
    - cron: '08 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: Hus_Renew
      cancel-in-progress: false
    env:
      # ════════════════════════════════════════════════════════════════
      # Secrets（在公开 repo → Settings → Secrets 中配置）
      # ════════════════════════════════════════════════════════════════
      # hus.co.id 账号，多个用分号分隔：
      #   phone,tg_bot_token,tg_chat_id,tg_api_id,tg_api_hash,tg_session
      #   TG 凭据（后三个字段）由每账号独立提供
      HUS_BATCH: ${{ secrets.HUS_BATCH }}
      # 代理
      PROXY_CONTENT: ${{ secrets.HUS_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # 可选
      SCREENSHOT_DIR: screenshots
      DEBUG_FLAG: "0"
      # 续期重试次数（外层）
      MAX_RENEW_RETRIES: "1"
      # IP 被封时切换 WARP 重试次数（内层）
      #所以一共会重试3*5=15次
      MAX_WARP_RETRIES: "5"
      # 登录重试次数
      MAX_LOGIN_RETRIES: "1"
      # 私有仓库（含 hus-renew.py）
      PRIVATE_REPO: jyucoeng/auto_hus_private
      PROJECT_DIR: hus

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg unzip curl wget jq ca-certificates

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 安装代理
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 1))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行续期
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: python3 -u hus-renew.py 2>&1 | tee hus-renew.log

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hus-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hus-renew-log-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/hus-renew.log
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5
