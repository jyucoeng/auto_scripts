name: 🔑 Setup TG Session

on:
  workflow_dispatch:
    inputs:
      phone:
        description: "手机号（如 +506-63532545）"
        required: true
        type: string
      code:
        description: "验证码（首次运行留空，收到验证码后重新运行填入）"
        required: false
        type: string
      password:
        description: "两步验证密码（没有则留空）"
        required: false
        type: string

env:
  TG_API_ID: ${{ secrets.TG_API_ID }}
  TG_API_HASH: ${{ secrets.TG_API_HASH }}
  TG_PHONE: ${{ inputs.phone }}
  PRIVATE_REPO: jyucoeng/auto_hax_private

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: hax_private
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install telethon>=1.36.0

      - name: 执行登录
        working-directory: hax_private
        run: |
          if [ -n "${{ inputs.code }}" ]; then
            if [ -n "${{ inputs.password }}" ]; then
              python3 setup_tg_session.py "${{ inputs.code }}" "${{ inputs.password }}"
            else
              python3 setup_tg_session.py "${{ inputs.code }}"
            fi
          else
            python3 setup_tg_session.py
          fi
