name: 🔄 Hax Auto Renew

on:
  schedule:
    - cron: '10 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: Hax_Renew
      cancel-in-progress: false
    env:
      # ════════════════════════════════════════════════════════════════
      # Secrets（在公开 repo → Settings → Secrets 中配置）
      # ════════════════════════════════════════════════════════════════
      # Telegram MTProto API（https://my.telegram.org）
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      # Telegram StringSession（运行私有仓库中 setup_tg_session.py 生成）
      TG_SESSION: ${{ secrets.TG_SESSION }}
      # hax.co.id 账号，每行一个：手机号格式（-不能少）+44-7594910002,tg_bot_token,tg_chat_id
      HAX_BATCH: ${{ secrets.HAX_BATCH }}
      # 代理（留空直连）
      PROXY_CONTENT: ${{ secrets.HAX_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # 可选
      SCREENSHOT_DIR: screenshots
      DEBUG_FLAG: "0"
      # 私有仓库（含 hax-renew.py）
      PRIVATE_REPO: jyucoeng/auto_hax_private
      PROJECT_DIR: hax

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk ffmpeg

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          if [ -f ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt ]; then
            pip install -r ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt
          else
            pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
            pip install telethon>=1.36.0 SpeechRecognition>=3.10.0 pydub>=0.25.1
            pip install ddddocr nest_asyncio
          fi

      - name: 安装代理
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行续期
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: python3 hax-renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5
