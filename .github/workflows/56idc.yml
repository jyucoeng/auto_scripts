name: 🔄 56IDC Auto Login

on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发
  schedule:
    # 每月 13 / 26 号 UTC 19:10（北京时间 03:10）
    - cron: '10 19 13,26 * *'

# 权限配置：允许提交和推送更改
permissions:
  contents: write
concurrency:
  group: 56idc-login
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_DIR: 56idc
      SCRIPT_NAME: 56idc_login.py
      SCRIPT_DESC: 56IDC 登录脚本
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      # IDC56_BATCH 格式: email,password[,tg_token,tg_chat] 每行一个账号，多个账号用换行符分隔
      IDC56_BATCH: ${{ secrets.IDC56_BATCH }}
      HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '51080' }}
    
    steps:
      # 步骤 1: 检出公开仓库
      - name: 📥 检出公开仓库
        uses: actions/checkout@v4
      
      # 步骤 1.5: 创建输出目录
      - name: 📁 创建输出目录
        run: |
          mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots

      # 步骤 2: 检出私有仓库
      - name: 📥 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: jyucoeng/auto_56_private
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      # 步骤 3: 设置 Python 环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 步骤 4: 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk

      # 步骤 5: 安装 Python 依赖
      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests seleniumbase pyvirtualdisplay ddddocr
          fi

      # 步骤 6: 安装 sing-box（如果需要代理）
      - name: 📡 安装 sing-box
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "${{ env.HY2_PROXY_URL }}" ]; then
            echo "⚠️ 未配置代理，跳过 sing-box 安装"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      # 步骤 7: 添加随机延迟
      - name: ⏳ 添加随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      # 步骤 8: 执行脚本
      - name: 🚀 执行 ${{ env.SCRIPT_DESC }}
        env:
          IDC56_BATCH: ${{ env.IDC56_BATCH }}
          HY2_PROXY_URL: ${{ env.HY2_PROXY_URL }}
          SOCKS_PORT: ${{ env.SOCKS_PORT }}
          SCREENSHOT_DIR: "screenshots"
        run: xvfb-run -a python ${{ env.SCRIPT_NAME }}
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}

      # 步骤 9: 上传截图
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 56idc-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots/
          retention-days: 7

      # 步骤 10: 清理本地截图
      - name: 🗑️ 清理本地截图
        if: always()
        run: |
          if [ -d "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots" ]; then
            rm -rf ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots/*
            echo "✅ 本地截图已清理"
          fi

      # 步骤 11: 提交时间文件到公开库
      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main  # 拉取远程更新
            git push origin HEAD:main
          fi